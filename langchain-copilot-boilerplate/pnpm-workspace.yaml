packages:
  - "apps/*"
  - "packages/*"

# Allow native/build scripts required by these dependencies (pnpm >= 10).
onlyBuiltDependencies:
  - "@scarf/scarf"
  - esbuild
  - sharp
  - unrs-resolver

# CopilotKit publishes frequently; exempt from any minimumReleaseAge policy.
minimumReleaseAgeExclude:
  - "@copilotkit/react-core"
  - "@copilotkit/react-ui"
  - "@copilotkit/runtime"
  - "@copilotkit/sdk-js"
  - "@copilotkit/shared"

allowBuilds:
  '@firebase/util': false
  '@scarf/scarf': set this to true or false
  esbuild: set this to true or false
  protobufjs: false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
