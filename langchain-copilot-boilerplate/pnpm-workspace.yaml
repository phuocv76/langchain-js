packages:
  - 'apps/*'
  - 'workers/*'
  - 'packages/*'

# Single source of truth for shared dependency versions (pnpm catalog).
# Packages reference these as "catalog:" — bump a version here and every
# workspace member follows. Exact pins (no ^) are the versions the embedded
# LangGraph runtime is verified against; run the regression suite in
# apps/space-agent/src/regression/ after changing any of them.
catalog:
  # Tooling
  typescript: ^5.9.3
  eslint: ^9.17.0
  '@eslint/js': ^9.17.0
  '@types/node': ^22.20.1
  tsx: ^4.22.4
  tsup: ^8.5.1
  wrangler: ^4.67.0
  '@cloudflare/workers-types': ^5.20260708.1
  # Server + utilities
  hono: ^4.12.28
  '@hono/node-server': ^1.19.14
  zod: ^3.24.1
  jose: ^6.2.3
  # LangChain stack (ranges constrained further by `overrides` below)
  langchain: ^1.5.3
  '@langchain/core': ^1.2.2
  '@langchain/langgraph': ^1.4.4
  '@langchain/langgraph-api': 1.4.3
  '@langchain/langgraph-checkpoint': ^1.1.3
  '@langchain/openai': ^1.5.5
  # CopilotKit + AG-UI (exact: internal-behavior coupling with the embed app)
  '@copilotkit/runtime': 1.62.3
  '@copilotkit/sdk-js': 1.62.3
  '@ag-ui/langgraph': 0.0.42
  '@ag-ui/client': 0.0.57
  '@ag-ui/core': 0.0.57

# Force a single instance of the LangChain stack. Two langchain versions
# (direct dep vs @ag-ui/langgraph's) create duplicate @langchain/core and
# @langchain/langgraph copies, which breaks channel identity and message
# class checks across the graph. LangGraph is pinned to 1.4.4: later 1.4.x
# type definitions reject this zod release's StateSchema fields.
overrides:
  langchain: 1.5.3
  '@langchain/core': 1.2.2
  '@langchain/langgraph': 1.4.4

# Allow native/build scripts required by these dependencies (pnpm >= 10).
onlyBuiltDependencies:
  - '@scarf/scarf'
  - esbuild
  - sharp
  - unrs-resolver

# CopilotKit publishes frequently; exempt from any minimumReleaseAge policy.
minimumReleaseAgeExclude:
  - '@copilotkit/runtime'
  - '@copilotkit/sdk-js'
  - '@copilotkit/shared'
  - '@langchain/core@1.2.2'
  - '@langchain/openai@1.5.5'
  - prettier@3.9.5

allowBuilds:
  '@firebase/util': false
  '@scarf/scarf': false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
  workerd: false
