# Self-hosted LangGraph server for dev/prod parity: checkpoints and threads
# live in Postgres instead of the dev server's .langgraph_api file cache.
#
#   cp .env.docker.sample .env.docker   # fill LANGSMITH_API_KEY etc.
#   pnpm dev:server                     # from apps/agent
#
# The API keeps serving on :2024, so the Hono runtime needs no config change.
# Run either this OR `pnpm dev` (in-memory dev server) — both bind :2024.
services:
  langgraph-redis:
    image: redis:6
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 1s
      retries: 5

  langgraph-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - langgraph-postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed for inspection (TablePlus/psql); not required by the app.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 1s
      retries: 10

  langgraph-api:
    build:
      context: ../..
      dockerfile: apps/agent/Dockerfile.langgraph
    ports:
      - '2024:8000'
    env_file:
      - .env.docker
    environment:
      DATABASE_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
      REDIS_URI: redis://langgraph-redis:6379
    depends_on:
      langgraph-redis:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy

volumes:
  langgraph-postgres-data:
